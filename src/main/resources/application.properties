spring.application.name=electricity-alerts

# H2 Database
spring.datasource.url=jdbc:h2:mem:electricitydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Thymeleaf
spring.thymeleaf.cache=false

# SMTP credentials must be supplied through environment variables.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=3000
spring.mail.properties.mail.smtp.writetimeout=5000

# Admin credentials must be supplied through environment variables.
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}