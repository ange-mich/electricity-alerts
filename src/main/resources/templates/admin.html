<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Credit Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h1 class="mb-4">Electricity Credit Dashboard</h1>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <div class="card mb-4">
        <div class="card-header">Add New Household</div>
        <div class="card-body">
            <form action="/admin/add" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="householdName" class="form-label">Household Name</label>
                        <input type="text" class="form-control" id="householdName"
                               name="householdName" required>
                    </div>
                    <div class="col-md-6">
                        <label for="ownerEmail" class="form-label">Owner Email</label>
                        <input type="email" class="form-control" id="ownerEmail"
                               name="ownerEmail" required>
                    </div>
                    <div class="col-md-6">
                        <label for="phoneNumber" class="form-label">Phone Number</label>
                        <input type="text" class="form-control" id="phoneNumber"
                               name="phoneNumber" placeholder="+261XXXXXXXXX" required>
                    </div>
                    <div class="col-md-6">
                        <label for="totalCredits" class="form-label">Total Credits</label>
                        <input type="number" class="form-control" id="totalCredits"
                               name="totalCredits" min="1" required>
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary w-100">Add Household</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">All Households</div>
        <div class="table-responsive">
            <table class="table table-striped mb-0">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Credits</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="h : ${households}">
                    <td th:text="${h.householdName}"></td>
                    <td th:text="${h.ownerEmail}"></td>
                    <td th:text="${h.phoneNumber}"></td>
                    <td>
                        <span th:text="${h.remainingCredits}"></span> /
                        <span th:text="${h.totalCredits}"></span>
                    </td>
                    <td>
                            <span th:if="${h.remainingCredits == 0}"
                                  class="badge bg-danger">Depleted</span>
                        <span th:if="${h.notified and h.remainingCredits > 0}"
                              class="badge bg-warning text-dark">Low - Notified</span>
                        <span th:if="${!h.notified and h.remainingCredits > 0}"
                              class="badge bg-success">OK</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(households)}">
                    <td colspan="5" class="text-center text-muted">
                        No households registered yet.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
